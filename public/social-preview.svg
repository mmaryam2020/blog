  <text x="212" y="118" text-anchor="middle" fill="#2563EB" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">
    AGENTIC DIARIES
  </text>
  <text x="88" y="220" fill="#111111" font-family="Arial, sans-serif" font-size="68" font-weight="800">
